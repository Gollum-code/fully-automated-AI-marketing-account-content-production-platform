name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Ruff format
        run: uv run ruff format --check src tests workers scripts
      - name: Ruff lint
        run: uv run ruff check src tests workers scripts
      - name: Web contracts
        run: uv run python scripts/dump_web_contracts.py --check
      - name: Mypy
        run: uv run mypy src tests workers scripts
      - name: Pytest
        run: uv run pytest -m "not gpu and not slow and not net" -q
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
