[project]
name = "studio-tts"
version = "0.1.0"
description = "AI 营销号制片台 · TTS 推理子环境（CosyVoice · Python 3.11）"
requires-python = ">=3.11,<3.12"

# ── 与 app 环境物理隔离（§01.6.2）──────────────────────────────
# 原因：torch 只有 cp311 wheel（本项目用 tts/.venv 的 3.11），
#      且 numpy 必须锁 1.26.x 规避 numpy 2.x 生态不兼容。
#      app 环境跑 3.12，两者共用 PYTHONPATH 会互相污染。
#
# torch 版本：原项目锁 2.4.0+cu121（对应作者机器 RTX 2080 Ti / sm_75）。
# 本机是 RTX 5060（Blackwell / sm_120），cu121 的内核最高只到 sm_90，
# 会在推理时报 "no kernel image is available" ⇒ 升级到 2.7.1+cu128
# （cu128 才含 sm_120 内核）。换回分界线已列出，见 docs 备注。
dependencies = [
  "torch==2.7.1+cu128",
  "torchaudio==2.7.1+cu128",
  "torchvision==0.22.1+cu128",
  "numpy>=1.26,<2",
  "modelscope>=1.20",
  "onnxruntime>=1.18",
  "soundfile>=0.12",
  "librosa>=0.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.8",
  "structlog>=24.1",
  # 常驻服务要 import studio.core.clock（ZoneInfo("Asia/Shanghai")）。
  # Windows 没有系统 tz 库 ⇒ 少了它报 ZoneInfoNotFoundError，
  # 而报错点离"少装了一个包"隔了四层 import（陷阱 162）。
  "tzdata>=2025.1; sys_platform == 'win32'",
]

# 本子项目只用于承载 venv，自身不作为包被安装
[tool.uv]
package = false

# torch cu128 轮子不在 PyPI（本地版本号 +cu128），从 PyTorch 官方索引解析。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }